server {
    listen 80;
    listen [::]:80;
    server_name jiyax.com;
    include /etc/nginx/snippets/origin-auth-check.conf;
    access_log /var/log/nginx/jiyax.com.access.log;
    error_log /var/log/nginx/jiyax.com.error.log;
    return 301 https://jiyax.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jiyax.com;
    include /etc/nginx/snippets/origin-auth-check.conf;
    ssl_certificate /etc/letsencrypt/live/jiyax.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiyax.com/privkey.pem;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/jiyax/current;
    index index.html;
    client_max_body_size 1m;
    access_log /var/log/nginx/jiyax.com.access.log;
    error_log /var/log/nginx/jiyax.com.error.log;

    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests" always;

    location / {
        try_files $uri $uri/ =404;
    }
    location = /index.html {
        expires -1;
    }
    location /assets/ {
        expires 365d;
        try_files $uri =404;
    }
    location = /robots.txt {
        expires 1h;
    }
    location = /sitemap.xml {
        expires 1h;
    }
    location ~ (^|/)\. {
        deny all;
    }
}
