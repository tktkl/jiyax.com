server {
    listen 80;
    listen [::]:80;
    server_name www.jiyax.com;
    include /etc/nginx/snippets/origin-auth-check.conf;
    access_log /var/log/nginx/www.jiyax.com.access.log;
    error_log /var/log/nginx/www.jiyax.com.error.log;
    return 301 https://jiyax.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.jiyax.com;
    include /etc/nginx/snippets/origin-auth-check.conf;
    ssl_certificate /etc/letsencrypt/live/jiyax.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiyax.com/privkey.pem;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    access_log /var/log/nginx/www.jiyax.com.access.log;
    error_log /var/log/nginx/www.jiyax.com.error.log;
    return 301 https://jiyax.com$request_uri;
}
